    </p>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // 读取 URL 参数:分类 c、搜索关键词 q
      var params = new URLSearchParams(location.search);
      var currentCat = params.get('c') || '全部';
      var keyword = (params.get('q') || '').toLowerCase();

      // 渲染筛选按钮
      var btnWrap = document.getElementById('filter-btns');
      CATEGORIES.forEach(function (cat) {
        var b = document.createElement('button');
        b.className = 'filter-btn' + (cat === currentCat ? ' active' : '');
        b.textContent = cat;
        b.addEventListener('click', function () {
          location.href = 'products.html?c=' + encodeURIComponent(cat);
        });
        btnWrap.appendChild(b);
      });

      // 按条件过滤
      var list = PRODUCTS.filter(function (p) {
        var okCat = currentCat === '全部' || p.category === currentCat;
        var okKw = !keyword ||
          p.name.toLowerCase().indexOf(keyword) >= 0 ||
          p.desc.toLowerCase().indexOf(keyword) >= 0 ||
          p.category.toLowerCase().indexOf(keyword) >= 0;
        return okCat && okKw;
      });

      document.getElementById('empty-tip').style.display = list.length ? 'none' : 'block';
      renderProducts(list, 'product-list');

      // 回填搜索框
      var kwInput = document.querySelector('.search-box input');
      if (kwInput && params.get('q')) kwInput.value = params.get('q');
    });
  </script>
</body>
