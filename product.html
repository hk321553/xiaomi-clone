<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品详情 - 小米商城</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="topbar">
    <div class="container">
      <nav class="topbar-nav">
        <a href="index.html">小米商城</a>
        <a href="products.html">MIUI</a>
        <a href="about.html">关于我们</a>
      </nav>
      <div>
        <a href="products.html">登录</a>
        <span style="margin:0 10px;">|</span>
        <a href="products.html">注册</a>
        <a class="topbar-cart" href="products.html">🛒 购物车 (<span data-cart-count>0</span>)</a>
      </div>
    </div>
  </div>

  <header class="header">
    <div class="container">
      <a class="logo" href="index.html">
        <span class="logo-badge">MI</span> 小米
      </a>
      <nav class="main-nav">
        <a href="index.html">首页</a>
        <a href="products.html">全部商品</a>
        <a href="products.html?c=手机">小米手机</a>
        <a href="products.html?c=电视">电视</a>
        <a href="products.html?c=笔记本">笔记本</a>
        <a href="products.html?c=智能硬件">智能硬件</a>
        <a href="about.html">服务</a>
      </nav>
      <div class="search-box">
        <input type="text" placeholder="搜索商品" aria-label="搜索商品">
        <button aria-label="搜索">🔍</button>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="crumb">
      <a href="index.html">首页</a> ›
      <a href="products.html">全部商品</a> ›
      <b id="crumb-name">商品详情</b>
    </div>

    <div class="detail-wrap">
      <div class="detail-ph" id="detail-ph">📦</div>
      <div class="detail-info">
        <h1 id="detail-title">商品名称</h1>
        <p class="detail-desc" id="detail-desc"></p>
        <div class="detail-price" id="detail-price"></div>
        <ul class="spec-list" id="detail-specs"></ul>
        <div>
          <button class="btn btn-primary" data-add-cart id="detail-buy">加入购物车</button>
          <a class="btn btn-outline" href="products.html">继续购物</a>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        © 2025 仿小米官网(作业演示)· 本站仅为学习用途,与小米公司无关
      </div>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var id = new URLSearchParams(location.search).get('id') || 'mi14ultra';
      renderDetail(id);
      var name = PRODUCTS.find(function (p) { return p.id === id; });
      if (name) document.getElementById('crumb-name').textContent = name.name;
    });
  </script>
</body>
</html>
